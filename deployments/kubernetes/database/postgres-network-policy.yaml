apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-netpol
  namespace: point-of-sale
spec:
  # Satu policy untuk kelima instance: semuanya diberi label tier=postgres.
  # Yang boleh masuk hanya PgBouncer di namespace ini (port 5432).
  podSelector:
    matchLabels:
      tier: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: point-of-sale
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: point-of-sale
    # DNS resolution for outbound service names.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
