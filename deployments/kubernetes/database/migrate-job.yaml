apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: point-of-sale
spec:
  template:
    metadata:
      labels:
        app: migrate
    spec:
      # Satu bounded context = satu PostgreSQL + satu PgBouncer: tunggu kelima
      # pooler siap sebelum menjalankan migrasi (pola sama seperti stats-backfill).
      # Yang di-probe PgBouncer, bukan PostgreSQL, karena hanya pooler yang
      # diekspos sebagai Service ke beban kerja aplikasi.
      initContainers:
        - name: wait-for-pgbouncer
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for the five PgBouncer instances..."
              until nc -z pgbouncer-identity.point-of-sale.svc.cluster.local 5432 \
                && nc -z pgbouncer-catalog.point-of-sale.svc.cluster.local 5432 \
                && nc -z pgbouncer-sales.point-of-sale.svc.cluster.local 5432 \
                && nc -z pgbouncer-merchant.point-of-sale.svc.cluster.local 5432 \
                && nc -z pgbouncer-email.point-of-sale.svc.cluster.local 5432; do
                echo "PgBouncer not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] All PgBouncer instances are ready!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: migrate
          image: ghcr.io/__GHCR_OWNER__/vertx-point-of-sale/db-migration:latest
          workingDir: /app
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          imagePullPolicy: IfNotPresent
      restartPolicy: OnFailure
