name: pos-postgres-local

# Satu database = satu bounded context: lima instance PostgreSQL terpisah,
# masing-masing di depan PgBouncer-nya sendiri. Service (dan job migrasi) konek
# lewat pooler, jadi DB_<CONTEXT>_HOST menunjuk ke container PgBouncer.
# edoburu/pgbouncer selalu listen di port 5432 container; host memetakan
# 6432-6436 supaya service host-run (.env root) bisa connect via localhost.
# Prefix context dipilih lewat pkg/database/cluster.go (Cluster*).
services:
  postgres_identity:
    image: postgres:17-alpine
    container_name: pos-postgres-identity
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: pos_identity
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    networks:
      - app_pointofsale_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d pos_identity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_identity:
    image: edoburu/pgbouncer:latest
    container_name: pos-pgbouncer-identity
    environment:
      DB_HOST: postgres_identity
      DB_PORT: "5432"
      DB_USER: DRAGON
      DB_PASSWORD: DRAGON
      DB_NAME: pos_identity
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6432:5432"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres_identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U DRAGON -d pos_identity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_merchant:
    image: postgres:17-alpine
    container_name: pos-postgres-merchant
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: pos_merchant
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_merchant_data:/var/lib/postgresql/data
    networks:
      - app_pointofsale_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d pos_merchant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_merchant:
    image: edoburu/pgbouncer:latest
    container_name: pos-pgbouncer-merchant
    environment:
      DB_HOST: postgres_merchant
      DB_PORT: "5432"
      DB_USER: DRAGON
      DB_PASSWORD: DRAGON
      DB_NAME: pos_merchant
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6433:5432"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres_merchant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U DRAGON -d pos_merchant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_catalog:
    image: postgres:17-alpine
    container_name: pos-postgres-catalog
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: pos_catalog
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    networks:
      - app_pointofsale_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d pos_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_catalog:
    image: edoburu/pgbouncer:latest
    container_name: pos-pgbouncer-catalog
    environment:
      DB_HOST: postgres_catalog
      DB_PORT: "5432"
      DB_USER: DRAGON
      DB_PASSWORD: DRAGON
      DB_NAME: pos_catalog
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6434:5432"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres_catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U DRAGON -d pos_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_sales:
    image: postgres:17-alpine
    container_name: pos-postgres-sales
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: pos_sales
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_sales_data:/var/lib/postgresql/data
    networks:
      - app_pointofsale_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d pos_sales"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer_sales:
    image: edoburu/pgbouncer:latest
    container_name: pos-pgbouncer-sales
    environment:
      DB_HOST: postgres_sales
      DB_PORT: "5432"
      DB_USER: DRAGON
      DB_PASSWORD: DRAGON
      DB_NAME: pos_sales
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6435:5432"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres_sales:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U DRAGON -d pos_sales"]
