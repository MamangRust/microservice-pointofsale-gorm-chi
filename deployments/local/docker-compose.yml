      - ./logs:/var/log/app
    ports:
      - "50052:50052"
      - "8082:8082"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_role:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_role
      - REDIS_DB=0

  user:
    image: user-pointofsale-service:1.0
    container_name: user_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50053:50053"
      - "8083:8083"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_user:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_user
      - REDIS_DB=0

  category:
    image: category-pointofsale-service:1.0
    container_name: category_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50054:50054"
      - "8084:8084"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_catalog:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_category:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_category
      - REDIS_DB=0

  cashier:
    image: cashier-pointofsale-service:1.0
    container_name: cashier_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50055:50055"
      - "8085:8085"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_merchant:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_cashier:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_cashier
      - REDIS_DB=0

  merchant:
    image: merchant-pointofsale-service:1.0
    container_name: merchant_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50056:50056"
      - "8086:8086"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_merchant:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_merchant:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_merchant
      - REDIS_DB=0

  orderitem:
    image: order_item-pointofsale-service:1.0
    container_name: orderitem_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50057:50057"
      - "8087:8087"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_sales:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_orderitem:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_orderitem
      - REDIS_DB=0

  order:
    image: order-pointofsale-service:1.0
    container_name: order_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50058:50058"
      - "8088:8088"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_sales:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_order:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_order
      - REDIS_DB=0

  product:
    image: product-pointofsale-service:1.0
    container_name: product_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50059:50059"
      - "8089:8089"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_catalog:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_product:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_product
      - REDIS_DB=0

  transaction:
    image: transaction-pointofsale-service:1.0
    container_name: transaction_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50060:50060"
      - "8090:8090"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_sales:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_transaction:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_transaction
      - REDIS_DB=0

  # ClickHouse — OLAP engine for the stats pipeline (F3).
  # CLICKHOUSE_USER/PASSWORD/DB create the user pkg/clickhouse expects.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: clickhouse-pointofsale
    ports:
      - "9000:9000"
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: pos
      CLICKHOUSE_USER: dragon
      CLICKHOUSE_PASSWORD: dragon_knight
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_pointofsale_data:/var/lib/clickhouse
      - ../../pkg/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - app_pointofsale_network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user dragon --password dragon_knight --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # stats_writer — Kafka consumer that materializes stats events into ClickHouse.
  # Also runs `backfill` on demand: docker compose run --rm stats_writer backfill
  stats_writer:
    image: stats_writer-pointofsale-service:1.0
    container_name: stats_writer_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    networks:
      - app_pointofsale_network
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      order:
        condition: service_started
      product:
        condition: service_started
      transaction:
        condition: service_started
      orderitem:
        condition: service_started
      cashier:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_DATABASE=pos
      - CLICKHOUSE_USERNAME=dragon
      - CLICKHOUSE_PASSWORD=dragon_knight
      - GRPC_ORDER_ADDR=order:50058
      - GRPC_PRODUCT_ADDR=product:50059
      - GRPC_TRANSACTION_ADDR=transaction:50060
      - GRPC_ORDERITEM_ADDR=orderitem:50057
      - GRPC_CASHIER_ADDR=cashier:50055

  # stats_reader — gRPC server (50070) that serves stats queries from ClickHouse.
  stats_reader:
    image: stats_reader-pointofsale-service:1.0
    container_name: stats_reader_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50070:50070"
    networks:
      - app_pointofsale_network
    depends_on:
      clickhouse:
        condition: service_healthy
      redis_apigateway:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - STATS_READER_LISTEN_ADDR=:50070
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_DATABASE=pos
      - CLICKHOUSE_USERNAME=dragon
      - CLICKHOUSE_PASSWORD=dragon_knight
      - REDIS_HOST=redis_apigateway
      - REDIS_PORT=6379
      - REDIS_PASSWORD=dragon_knight
      - REDIS_DB=0

  kafka:
    image: apache/kafka:latest
    container_name: my-kafka-pointofsale
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: kraft-cluster-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - app_pointofsale_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter_pointofsale
    ports:
      - "9308:9308"
    networks:
      - app_pointofsale_network
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=my-kafka-pointofsale:9092"
      - "--web.listen-address=0.0.0.0:9308"
      - "--log.level=debug"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_pointofsale
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/rules:/etc/prometheus/rules
    networks:
      - app_pointofsale_network
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_pointofsale
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_pointofsale-storage:/var/lib/grafana
    networks:
      - app_pointofsale_network
    depends_on:
      - prometheus
      - jaeger
      - alertmanager
      - loki

  nginx:
    image: nginx:alpine
    container_name: nginx_pointofsale
    ports:
      - "80:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - apigateway
    networks:
      - app_pointofsale_network

  redis_apigateway:
    image: redis:7.4
    container_name: redis_apigateway
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6379:6379"
    volumes:
      - redis_apigateway_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_auth:
    image: redis:7.4
    container_name: redis_auth
    command: >
      redis-server
      --requirepass dragon_knight
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --maxclients 10000
    ports:
      - "6380:6379"
    volumes:
      - redis_auth_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_role:
    image: redis:7.4
    container_name: redis_role
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6381:6379"
    volumes:
      - redis_role_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_user:
    image: redis:7.4
    container_name: redis_user
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6382:6379"
    volumes:
      - redis_user_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_category:
    image: redis:7.4
    container_name: redis_category
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6383:6379"
    volumes:
      - redis_category_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_cashier:
    image: redis:7.4
    container_name: redis_cashier
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6384:6379"
    volumes:
      - redis_cashier_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_merchant:
    image: redis:7.4
    container_name: redis_merchant
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6385:6379"
    volumes:
      - redis_merchant_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_orderitem:
    image: redis:7.4
    container_name: redis_orderitem
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6386:6379"
    volumes:
      - redis_orderitem_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_order:
    image: redis:7.4
    container_name: redis_order
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6387:6379"
    volumes:
      - redis_order_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_product:
    image: redis:7.4
    container_name: redis_product
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6388:6379"
    volumes:
      - redis_product_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_transaction:
    image: redis:7.4
    container_name: redis_transaction
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6389:6379"
    volumes:
      - redis_transaction_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  node-exporter:
    image: quay.io/prometheus/node-exporter
    container_name: node-exporter_pointofsale
    pid: "host"
    networks:
      - app_pointofsale_network
    volumes:
      - "/:/host:ro,rslave"
    command:
      - '--path.rootfs=/host'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector_pointofsale
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8889:8889"
    networks:
      - app_pointofsale_network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger_pointofsale
    ports:
      - "6831:6831/udp"
      - "16686:16686"
    networks:
      - app_pointofsale_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager_pointofsale
    volumes:
      - ../../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - app_pointofsale_network

  loki:
    image: grafana/loki:2.9.0
    container_name: loki_pointofsale
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_pointofsale_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_pointofsale_network

volumes:
  postgres_identity_data:
  postgres_catalog_data:
  postgres_sales_data:
  postgres_merchant_data:
  postgres_email_data:
  loki_pointofsale_data:
  grafana_pointofsale-storage:
  kafka_pointofsale_data:
  clickhouse_pointofsale_data:
  redis_apigateway_data:
  redis_auth_data:
  redis_role_data:
  redis_user_data:
  redis_category_data:
  redis_cashier_data:
  redis_merchant_data:
  redis_orderitem_data:
  redis_order_data:
  redis_product_data:
  redis_transaction_data:

networks:
  app_pointofsale_network:
    driver: bridge
