      start_period: 10s

  pgbouncer_email:
    image: edoburu/pgbouncer:latest
    container_name: pos-pgbouncer-email
    environment:
      DB_HOST: postgres_email
      DB_PORT: "5432"
      DB_USER: DRAGON
      DB_PASSWORD: DRAGON
      DB_NAME: pos_email
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "100"
    ports:
      - "6436:5432"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres_email:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U DRAGON -d pos_email"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - "4040:4040"
    networks:
      - app_pointofsale_network

  migrate:
    image: migrate-pointofsale-service:1.0
    container_name: migrate
    volumes:
      - ./docker.env:/app/docker.env
      - ../../service:/app/service
    env_file: ./docker.env
    environment:
      APP_ENV: docker
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_identity:
        condition: service_healthy
      pgbouncer_catalog:
        condition: service_healthy
      pgbouncer_sales:
        condition: service_healthy
      pgbouncer_merchant:
        condition: service_healthy
      pgbouncer_email:
        condition: service_healthy

  apigateway:
    image: apigateway-pointofsale-service:1.0
    container_name: apigateway_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "5000:5000"
    networks:
      - app_pointofsale_network
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      auth:
        condition: service_started
      role:
        condition: service_started
      user:
        condition: service_started
      category:
        condition: service_started
      merchant:
        condition: service_started
      orderitem:
        condition: service_started
      order:
        condition: service_started
      product:
        condition: service_started
      transaction:
        condition: service_started
      stats_reader:
        condition: service_started
      redis_apigateway:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_apigateway
      - REDIS_DB=0
      - GRPC_STATS_READER_ADDR=stats_reader:50070

  auth:
    image: auth-pointofsale-service:1.0
    container_name: auth_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50051:50051"
      - "8081:8081"
    networks:
      - app_pointofsale_network
    depends_on:
      pgbouncer_identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_auth:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_auth
      - REDIS_DB=0

  role:
