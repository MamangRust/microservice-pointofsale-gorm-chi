syntax = "proto3";

package pb;

import "order_item/order_item_common.proto";

option go_package = "github.com/MamangRust/microservice-point-of-sale-pb/order_item;order_item";

// Note: order.proto already declares CreateOrderItemRequest/UpdateOrderItemRequest
// in the same "pb" package, so the command messages here use the "Record" suffix.
message CreateOrderItemRecordRequest {
    int32 order_id = 1;
    int32 product_id = 2;
    int32 quantity = 3;
    int32 price = 4;
}

message UpdateOrderItemRecordRequest {
    int32 order_item_id = 1;
    int32 order_id = 2;
    int32 product_id = 3;
    int32 quantity = 4;
    int32 price = 5;
}

message DeleteOrderItemRecordRequest {
    int32 order_item_id = 1;
}

service OrderItemCommandService {
    rpc CreateOrderItem(CreateOrderItemRecordRequest) returns (ApiResponseOrderItem);
    rpc UpdateOrderItem(UpdateOrderItemRecordRequest) returns (ApiResponseOrderItem);
    rpc DeleteOrderItem(DeleteOrderItemRecordRequest) returns (ApiResponseOrderItemDelete);
}
