receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  jaeger:
    protocols:
      grpc:
        endpoint: "0.0.0.0:14250"      
      thrift_binary:
        endpoint: "0.0.0.0:6832"      
      thrift_compact:
        endpoint: "0.0.0.0:6831"       
      thrift_http:
        endpoint: "0.0.0.0:14268"       

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['otel-collector:8889']
              labels:
                application: 'Otel Collector'
                environment: 'production'

        - job_name: 'kafka-exporter'
          static_configs:
            - targets: ['kafka-exporter:9308']
              labels:
                application: 'Kafka Exporter'
                environment: 'production'

        # NOTE: gRPC services do not expose /metrics endpoints (8081-8090).
        # Their OpenTelemetry metrics arrive via the `otlp` receiver and are
        # exported on :8889 with the `service_name` label.

processors:
  batch:

  resource:
    attributes:
      - key: service.name
        from_attribute: service.name
        action: upsert
      - key: environment
        value: production
        action: insert

exporters:
  otlp:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"
    # Namespace di depan semua metric OTLP sehingga nama di Prometheus adalah
    # golang_app_<metric> (sama dengan payment-gateway). Alert rules memakai
    # nama asli instrumentasi ini (lessons learned §8.1 poin 2).
    namespace: "golang_app"

  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

extensions:
  health_check:
  pprof:
  zpages:

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/loki]