# Order item service alerts.
#
# Metric names match the actual instrumentation (§8.1 poin 2):
# requests_total / request_duration_seconds / errors_total exported by the OTel
# collector under the golang_app namespace with the service_name label.
groups:
  - name: order_item-service-alerts
    rules:
      - alert: HighErrorRate_OrderItemService
        expr: |
          sum(rate(golang_app_errors_total{service_name="order_item-service"}[5m]))
          / sum(rate(golang_app_requests_total{service_name="order_item-service"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: order_item-service
        annotations:
          summary: "High error rate on order_item-service"
          description: "More than 10% of order_item-service requests fail in the last 5 minutes."

      - alert: HighP95Latency_OrderItemService
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(golang_app_request_duration_seconds_bucket{service_name="order_item-service"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
          service: order_item-service
        annotations:
          summary: "P95 latency high on order_item-service"
          description: "95th percentile latency of order_item-service exceeds 1s for 5 minutes."

      - alert: NoTraffic_OrderItemService
        expr: |
          rate(golang_app_requests_total{service_name="order_item-service"}[10m]) == 0
        for: 10m
        labels:
          severity: info
          service: order_item-service
        annotations:
          summary: "No traffic on order_item-service"
          description: "No requests recorded for order_item-service in the last 10 minutes."
